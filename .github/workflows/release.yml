name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tabloy/keygate

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Full history so the previous tag is reachable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release body is the commits since the previous tag, plus a
      # compare link. No file to maintain and no commit convention
      # required: it always reflects exactly what landed. This is the
      # single source of the body — generate_release_notes is off so the
      # notes are fully deterministic and don't add a second, PR-based
      # "What's Changed" section on top of this one.
      - name: Build release notes from git log
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
          } > release-notes.md

      # append_body is left at its default (false) so re-running the
      # release for an existing tag OVERWRITES the body with this
      # deterministic content instead of appending the commit list again.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
